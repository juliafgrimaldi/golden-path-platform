apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "tenant.namespace" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    # Pod Security Admission: no privileged pods, no host access, must run as non-root.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    platform.golden-path.io/owners: {{ join "," .Values.team.owners | quote }}
    # Never let a pruned Application delete a namespace full of workloads (docs/adr/0002).
    argocd.argoproj.io/sync-options: Delete=false
