# Default deny for the whole namespace, then explicit allows (docs/adr/0004).
# Ingress: own namespace, platform observability, and tenants listed in network.allowFrom.
# Egress: DNS, anything in-cluster (the receiver's ingress policy decides), declared FQDNs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tenant-isolation
  namespace: {{ include "tenant.namespace" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
    {{- range .Values.network.allowFrom }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tenant-{{ .tenant }}
      toPorts:
        - ports:
            {{- range .ports }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - cluster
    {{- with .Values.network.egressFQDNs }}
    - toFQDNs:
        {{- range . }}
        {{- if hasPrefix "*." . }}
        - matchPattern: {{ . | quote }}
        {{- else }}
        - matchName: {{ . | quote }}
        {{- end }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
